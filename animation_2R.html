<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simulation Bras Robotique</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #1a5fb4;
            font-size: 22px;
            margin-bottom: 15px;
        }
        .container {
            display: flex;
            gap: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        canvas {
            border: 1px solid #ccc;
            background-color: #ffffff;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 340px;
        }
        .control-group {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #1a5fb4;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        .math-symbol {
            font-style: italic;
            font-family: "Times New Roman", serif;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        input[type=range] {
            flex-grow: 1;
        }
        input[type=number] {
            width: 65px;
            padding: 4px;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
        }
        .status.ok {
            background-color: #e1f5fe;
            color: #0277bd;
        }
        .status.error {
            background-color: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>

    <h1>Simulation Bras Robotique</h1>

    <div class="container">
        <canvas id="simCanvas" width="550" height="550"></canvas>
        
        <div class="controls">
            <div class="control-group">
                <label>Longueur <span class="math-symbol">l₁</span> (Segment O₁O₂) :</label>
                <div class="control-row">
                    <input type="range" id="l1Range" min="50" max="250" value="200">
                    <input type="number" id="l1Num" min="50" max="250" value="200">
                </div>
            </div>

            <div class="control-group">
                <label>Longueur <span class="math-symbol">l₂</span> (Segment O₂P) :</label>
                <div class="control-row">
                    <input type="range" id="l2Range" min="50" max="250" value="200">
                    <input type="number" id="l2Num" min="50" max="250" value="200">
                </div>
            </div>

            <div class="control-group">
                <label>Angle <span class="math-symbol">θ₁</span> (°):</label>
                <div class="control-row">
                    <input type="range" id="t1Range" min="-180" max="180" value="90">
                    <input type="number" id="t1Num" min="-180" max="180" value="90">
                </div>
            </div>

            <div class="control-group">
                <label>Angle <span class="math-symbol">θ₂</span> (°):</label>
                <div class="control-row">
                    <input type="range" id="t2Range" min="-180" max="180" value="0">
                    <input type="number" id="t2Num" min="-180" max="180" value="0">
                </div>
            </div>

            <div id="statusBox" class="status ok">État : Configuration valide</div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const origin = { x: 80, y: 470 };
    const scale = 1;

    // Association des éléments de contrôle (curseurs et champs numériques)
    const controls = {
        l1: { range: document.getElementById('l1Range'), num: document.getElementById('l1Num') },
        l2: { range: document.getElementById('l2Range'), num: document.getElementById('l2Num') },
        t1: { range: document.getElementById('t1Range'), num: document.getElementById('t1Num') },
        t2: { range: document.getElementById('t2Range'), num: document.getElementById('t2Num') }
    };

    const statusBox = document.getElementById('statusBox');

    function syncInputs(source, target) {
        target.value = source.value;
        updateScene();
    }

    // Synchronisation croisée curseurs <-> champs numériques
    Object.keys(controls).forEach(key => {
        let c = controls[key];
        c.range.addEventListener('input', () => syncInputs(c.range, c.num));
        c.num.addEventListener('input', () => syncInputs(c.num, c.range));
    });

    function isSegmentValid(p1, p2) {
        const steps = 10;
        for (let i = 0; i <= steps; i++) {
            let t = i / steps;
            let x = p1.x + t * (p2.x - p1.x);
            let y = p1.y + t * (p2.y - p1.y);
            if (x < -0.1 || y < -0.1) return false;
        }
        return true;
    }

    function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grille style GeoGebra
        ctx.strokeStyle = '#e5e5e5';
        ctx.lineWidth = 1;
        const stepGrid = 40;

        for (let x = origin.x; x < canvas.width; x += stepGrid) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let x = origin.x; x > 0; x -= stepGrid) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = origin.y; y > 0; y -= stepGrid) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
        for (let y = origin.y; y < canvas.height; y += stepGrid) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Axes principaux
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, origin.y); ctx.lineTo(canvas.width - 10, origin.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(origin.x, canvas.height); ctx.lineTo(origin.x, 10); ctx.stroke();

        ctx.fillStyle = '#333';
        ctx.font = '14px Arial';
        ctx.fillText("x₀", canvas.width - 25, origin.y - 10);
        ctx.fillText("y₀", origin.x + 10, 20);
        ctx.fillText("O₁", origin.x - 20, origin.y + 20);
    }

    function drawAccessibleEnvelope(l1, l2) {
        ctx.fillStyle = 'rgba(26, 95, 180, 0.12)';
        ctx.strokeStyle = 'rgba(26, 95, 180, 0.4)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);

        ctx.beginPath();
        let first = true;
        
        for (let a1 = -Math.PI; a1 <= Math.PI; a1 += 0.05) {
            for (let a2 = -Math.PI; a2 <= Math.PI; a2 += 0.05) {
                let o1 = { x: 0, y: 0 };
                let o2 = { x: l1 * Math.cos(a1), y: l1 * Math.sin(a1) };
                let p = { x: o2.x + l2 * Math.cos(a1 + a2), y: o2.y + l2 * Math.sin(a1 + a2) };

                if (isSegmentValid(o1, o2) && isSegmentValid(o2, p)) {
                    let canvasX = origin.x + p.x * scale;
                    let canvasY = origin.y - p.y * scale;
                    if (first) {
                        ctx.moveTo(canvasX, canvasY);
                        first = false;
                    } else {
                        ctx.lineTo(canvasX, canvasY);
                    }
                }
            }
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawPoint(x, y, label, isHighlight = false) {
        ctx.fillStyle = isHighlight ? '#c51d34' : 'white';
        ctx.strokeStyle = '#1a5fb4';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#333';
        ctx.font = 'bold 13px Arial';
        ctx.fillText(label, x + 10, y - 10);
    }

    function updateScene() {
        const l1 = parseFloat(controls.l1.range.value);
        const l2 = parseFloat(controls.l2.range.value);
        const theta1 = parseFloat(controls.t1.range.value) * Math.PI / 180;
        const theta2 = parseFloat(controls.t2.range.value) * Math.PI / 180;

        drawGrid();
        drawAccessibleEnvelope(l1, l2);

        // Calculs positions bras
        const O1 = origin;
        const O2 = {
            x: origin.x + l1 * Math.cos(theta1) * scale,
            y: origin.y - l1 * Math.sin(theta1) * scale
        };
        const P = {
            x: O2.x + l2 * Math.cos(theta1 + theta2) * scale,
            y: O2.y - l2 * Math.sin(theta1 + theta2) * scale
        };

        const o1Math = { x: 0, y: 0 };
        const o2Math = { x: l1 * Math.cos(theta1), y: l1 * Math.sin(theta1) };
        const pMath = { x: o2Math.x + l2 * Math.cos(theta1 + theta2), y: o2Math.y + l2 * Math.sin(theta1 + theta2) };

        const isValid = isSegmentValid(o1Math, o2Math) && isSegmentValid(o2Math, pMath);

        if (isValid) {
            statusBox.textContent = "État : Configuration valide (Dans le premier quadrant)";
            statusBox.className = "status ok";
        } else {
            statusBox.textContent = "État : HORS LIMITES (Segment en dehors du mur)";
            statusBox.className = "status error";
        }

        // Dessin segment l1
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#1a5fb4';
        ctx.beginPath();
        ctx.moveTo(O1.x, O1.y);
        ctx.lineTo(O2.x, O2.y);
        ctx.stroke();

        // Dessin segment l2
        ctx.strokeStyle = isValid ? '#2ec27e' : '#c51d34';
        ctx.beginPath();
        ctx.moveTo(O2.x, O2.y);
        ctx.lineTo(P.x, P.y);
        ctx.stroke();

        // Points
        drawPoint(O1.x, O1.y, "O₁");
        drawPoint(O2.x, O2.y, "O₂");
        drawPoint(P.x, P.y, "P", true);
    }

    // Premier rendu au chargement
    updateScene();
</script>

</body>
</html>
